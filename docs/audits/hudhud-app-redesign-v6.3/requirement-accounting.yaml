  - id: PAY-07
    title: "Exact procedure for each payout method is an Open Item needing an accountant"
    product_evidence: "PDF p.34, Appendix A p.44"
    owner: finance
    wave: W27
    status: BLOCKED_BUSINESS_DECISION
    decision_source: "v6.3 Appendix A p.44 / p.34"
    why_blocked: "The exact procedure per payout method must be defined by an accountant. Fees, timing and reconciliation per method are financial policy."
    surrounding_structure_implemented: true
    blocked_operation: "POST /finance/payouts/{payout_id}/pay"
    fail_closed_evidence:
      - services/finance/src/finance/application/settlement_service.py
      - services/finance/tests/test_settlement.py
      - services/finance/tests/test_finance_api.py
      - tests/new_service_migration_proof/test_finance_store.py
    notes: >-
      Everything except the payment itself is implemented and tested: the request, its
      method, its destination, the balance check, approval, rejection, and the two facts
      those publish. Paying one out means choosing a fee schedule, a timing rule and a
      reconciliation step per method, which is the document Appendix A says an accountant
      owes. The refusal posts nothing, publishes nothing and marks nothing paid — proven
      against real PostgreSQL. `paid_at` and `paid_entry_id` already exist on the table so
      the eventual decision is a code change, not a migration on live financial data.

  - id: PAY-08
    title: "Refusal ⇒ merchant charged both the return-trip fee and the original delivery fee, regardless of reason"
    product_evidence: "PDF p.38, p.39"
    owner: finance
    wave: W27
    status: BLOCKED_BUSINESS_DECISION
    decision_source: "v6.3 Appendix A p.44 / p.38"
    why_blocked: "Whether Hudhud may waive the return-trip fee for a merchant is undecided."
    surrounding_structure_implemented: true
    blocked_operation: "POST /finance/refusal-charges/waive"
    implemented_half: "POST /finance/refusal-charges — the charge v6.3 p.38 and p.39 settle"
    fail_closed_evidence:
      - services/finance/src/finance/application/settlement_service.py
      - services/finance/tests/test_settlement.py
      - services/finance/tests/test_finance_api.py
    notes: >-
      The charge is NOT blocked. v6.3 p.38 and p.39 say a refusal charges the merchant
      both the return-trip fee and the original delivery fee regardless of reason, and
      that is implemented, posted to the ledger and tested. Only the waiver is refused,
      because granting one would decide the Open Item. The waiver is written in full
      behind `FINANCE_RETURN_FEE_WAIVER_PERMITTED`, which is off and has no safe default
      on; a test proves it works the moment the business permits it, and another proves
      charging is never coupled to the waiver being undecided.


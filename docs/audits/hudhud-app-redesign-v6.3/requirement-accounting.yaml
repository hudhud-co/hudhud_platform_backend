# Requirement accounting — HUDHUD v6.3 platform rebuild
#
# One entry per requirement in 03-REQUIREMENTS-CATALOG.md. Machine-checked by
# scripts/quality/verify_requirement_accounting.py, which fails the build if any
# catalogued id is missing, duplicated, unknown, or carries a status it cannot support.
#
# status:
#   COMPLETE                  - domain behaviour, persistence, API/event contract,
#                               authorization and tests are all implemented.
#   PLANNED                   - owner and wave assigned, implementation not yet done.
#   BLOCKED_BUSINESS_DECISION - a v6.3 executive Open Item (Appendix A p.44). The
#                               surrounding domain structure is built; only the exact
#                               operation that needs the decision is refused.
#   SOURCE_CONFLICT           - two authoritative product sources contradict each other.
#                               Both alternatives are recorded and the choice is
#                               configuration with no default.


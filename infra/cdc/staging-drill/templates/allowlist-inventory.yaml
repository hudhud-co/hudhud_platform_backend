    notes: >
      Legacy evidence: all 13 status writers append atomically with status mutation.
      UUID v4 PK — not time-ordered; cursor tie-break required.

  - table: public.audit_logs
    classification: confidential
    append_only_evidence: true
    primary_key: id
    ordering_cursor: "(created_at ASC, id ASC)"
    replica_identity: DEFAULT
    observation_contract:
      event_type: legacy_bridge.observation.audit_entry
      event_version: 1
      stream: HUDHUD_AUDIT
    event_id_formula: "UUIDv5(namespace, '{source_system}:{source_table}:{source_pk}')"
    pii_fields:
      - metadata_jsonb  # may contain IP/user_agent — classify per field policy
    excluded_columns: []
    publication_included: true
    notes: >
      Decentralized writers; not every shipment_event has matching audit row.


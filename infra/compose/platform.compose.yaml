      CUSTOMER_IDENTITY_BASE_URL: "http://identity:8101"
      CUSTOMER_IDENTITY_SERVICE_CREDENTIAL: "hudhud-dev-service-credential"
      IDENTITY_SERVICE_CREDENTIAL: "hudhud-dev-service-credential"
    healthcheck:

# The whole HUDHUD platform in containers: one PostgreSQL, one NATS, fourteen services.
#
#     docker compose -f infra/compose/platform.compose.yaml up -d --build
#
# or, from the repository root, `make docker-up`.
#
# Three things worth knowing:
#
# * **A database per service, not a schema per service** (ADR-0011). `postgres-init/`
#   creates all fourteen on first boot, and each service is handed only its own URL.
# * **Each service migrates its own schema** before it serves — it owns that schema, so
#   nothing else is entitled to. See any service's `docker-entrypoint.sh`.
# * **Every service is wired to Identity.** These services deny everything when Identity
#   is unreachable, so a stack without it looks broken in a confusing way.
#
# Ports match `architecture/runtime-port-registry.yaml` for `platform_local_dev`: the
# container port equals the host port, bound to 127.0.0.1 because the registry records
# `public_exposure: false`. The same URLs work whether you ran `make up` or `make
# docker-up`.
#
# The secrets here are development values, and are the same ones `scripts/dev/stack.py`
# uses. Identity refuses `console` OTP delivery outside local and test, so this file
# cannot be pointed at staging by accident.

name: hudhud-platform

x-service: &service
  restart: unless-stopped
  networks: [hudhud]
  depends_on:
    postgres: {condition: service_healthy}
    nats: {condition: service_started}

networks:
  hudhud:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: hudhud_dev_only
      POSTGRES_DB: postgres
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    # Disposable by design: `down` leaves nothing on disk and never touches a
    # developer's own PostgreSQL.
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      # `pg_isready` answers yes to the temporary socket-only server the image runs while
      # it initialises, so this asks for a real query over TCP instead.
      test: ["CMD-SHELL", "PGPASSWORD=hudhud_dev_only psql -h 127.0.0.1 -U postgres -d claims_db -tAc 'SELECT 1' || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    networks: [hudhud]

  nats:
    image: nats:2.10.24-alpine
    command: ["-js", "-m", "8222"]
    ports: ["127.0.0.1:54222:4222"]
    networks: [hudhud]


  identity:
    <<: *service
    build:
      context: ../..
      dockerfile: services/identity/Dockerfile
    image: hudhud/identity:dev
    ports: ["127.0.0.1:8101:8101"]
    environment:
      IDENTITY_DATABASE_URL: "postgresql+psycopg://postgres:hudhud_dev_only@postgres:5432/identity_db"
      DATABASE_URL: "postgresql+psycopg://postgres:hudhud_dev_only@postgres:5432/identity_db"
      IDENTITY_ENVIRONMENT: "local"
      IDENTITY_NATS_URL: "nats://nats:4222"
      IDENTITY_SIGNING_KEY: "hudhud-dev-identity-signing-key"
      IDENTITY_SERVICE_CREDENTIALS: "customer:hudhud-dev-service-credential,merchant:hudhud-dev-service-credential,ordering:hudhud-dev-service-credential,hub:hudhud-dev-service-credential,notification:hudhud-dev-service-credential,workforce:hudhud-dev-service-credential,delivery:hudhud-dev-service-credential,finance:hudhud-dev-service-credential,pickup:hudhud-dev-service-credential,shipment:hudhud-dev-service-credential,tracking:hudhud-dev-service-credential,audit:hudhud-dev-service-credential,claims:hudhud-dev-service-credential"
      IDENTITY_OTP_DELIVERY_CHANNEL: "console"
      IDENTITY_BOOTSTRAP_OPERATIONS_PHONE: "+9647700000001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8101/health').read()"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  customer:
    <<: *service

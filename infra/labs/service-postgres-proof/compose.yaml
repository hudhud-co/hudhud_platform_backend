# HUDHUD Wave 6-A — disposable PostgreSQL 16 migration/persistence proof lab.
# Synthetic credentials only; no legacy, staging, or production connectivity.
# Ephemeral loopback host port; dedicated Compose project, network, and volume.

name: hudhud-service-postgres-proof-lab

services:
  postgres:
    image: postgres:16-alpine
    container_name: hudhud-service-postgres-proof-postgres
    profiles:
      - service-postgres-proof
    restart: unless-stopped
    environment:
      POSTGRES_USER: svc_pg_lab_owner
      POSTGRES_PASSWORD: svc_pg_lab_owner_dev_only
      POSTGRES_DB: svc_pg_lab
    command:
      - postgres
      - -c
      - max_prepared_transactions=10
    ports:
      - target: 5432
        host_ip: 127.0.0.1
        published: 0
        protocol: tcp
    volumes:
      - type: volume
        source: hudhud_service_postgres_proof_pgdata
        target: /var/lib/postgresql/data
      - type: bind
        source: ./init
        target: /docker-entrypoint-initdb.d
        read_only: true
    networks:
      - hudhud_service_postgres_proof
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U svc_pg_lab_owner -d svc_pg_lab"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    labels:
      hudhud.lab: service-postgres-proof
      hudhud.wave: "6-A"

networks:
  hudhud_service_postgres_proof:
    name: hudhud_service_postgres_proof
    driver: bridge

volumes:
  hudhud_service_postgres_proof_pgdata:
    name: hudhud_service_postgres_proof_pgdata

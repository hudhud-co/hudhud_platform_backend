# ADR-0002 durable consumer templates (D4 pattern).
# One durable per consuming service + logical subscription/projection.
# Replicas of the same consumer group share one durable.
# Different services/projections use different durables.
# No durable per event instance; no single global durable for an entire stream.
#
# All entries below are PROVISIONAL foundation examples — not accepted domain contracts.

version: 1
defaults:
  ack_policy: explicit
  ack_wait: 30s
  max_deliver: 5
  max_ack_pending: 100
  deliver_policy: all
  replay_policy: instant
  duplicate_window: 2m
  max_waiting: 512
  backoff:
    - 5s
    - 30s
    - 2m
    - 10m
    - 30m

consumers:
  - stream: HUDHUD_PICKUP
    durable_name: shipment_pickup_facts_v1
    filter_subject: hudhud.pickup.pickup.fact.>
    description: >
      [provisional] Shipment service inbox projection for pickup facts.
      Distinct from other services consuming pickup stream subjects.

  - stream: HUDHUD_SHIPMENT
    durable_name: tracking_lifecycle_v1
    filter_subject: hudhud.shipment.shipment.fact.>
    description: >
      [provisional] Tracking projection durable — independent from shipment's own handlers.

  - stream: HUDHUD_DELIVERY
    durable_name: finance_cod_collected_v1
    filter_subject: hudhud.delivery.delivery.fact.cod_collected.v1
    description: >
      [provisional] Finance consumer for operational COD collected facts published by Delivery.
      Finance owns financial posting; Delivery never writes Wallet authority.

  - stream: HUDHUD_SHIPMENT
    durable_name: finance_shipment_delivered_v1
    filter_subject: hudhud.shipment.shipment.fact.delivered.v1
    description: >
      [provisional] Finance consumer for ShipmentDelivered canonical facts.
      Correlates with CodCollected by shipment_id (ADR-0003/0005).

  - stream: HUDHUD_FINANCE
    durable_name: wallet_merchant_payable_v1
    filter_subject: hudhud.finance.finance.fact.merchant_payable_recognized.v1
    description: >
      [provisional] Wallet projection consumer — Finance-authorized merchant payable only.
      Wallet is a projection; Finance is the posting authority.

  - stream: HUDHUD_SHIPMENT
    durable_name: notification_lifecycle_v1
    filter_subject: hudhud.shipment.>
    description: >
      [provisional] Notification consumer on shipment stream — separate durable from tracking.

  - stream: HUDHUD_SHIPMENT
    durable_name: tracking_bridge_timeline_v1
    filter_subject: hudhud.shipment.legacy_bridge.observation.shipment_timeline_entry.v1
    description: >
      [provisional] Tracking/Control Tower consumer for Bridge shipment timeline observations.

  - stream: HUDHUD_AUDIT
    durable_name: audit_bridge_entry_v1
    filter_subject: hudhud.audit.legacy_bridge.observation.audit_entry.v1
    description: >
      [provisional] Audit service consumer for Bridge audit entry observations.

  - stream: HUDHUD_DLQ
    durable_name: platform_dlq_observer_v1
    filter_subject: hudhud.dlq.>
    description: >
      [provisional] Operational observer for poison/quarantine subjects (foundation smoke only).

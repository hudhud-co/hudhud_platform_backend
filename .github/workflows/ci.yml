name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.10.2"

jobs:
  path-impact:
    name: Path impact
    runs-on: ubuntu-latest
    outputs:
      full_validation: ${{ steps.impact.outputs.full_validation }}
      fail_safe: ${{ steps.impact.outputs.fail_safe }}
      docs_only: ${{ steps.impact.outputs.docs_only }}
      run_service_scoped: ${{ steps.impact.outputs.run_service_scoped }}
      affected_services: ${{ steps.impact.outputs.affected_services }}
      affected_packages: ${{ steps.impact.outputs.affected_packages }}
      run_contracts_tests: ${{ steps.impact.outputs.run_contracts_tests }}
      run_cdc_staging_drill_tests: ${{ steps.impact.outputs.run_cdc_staging_drill_tests }}
      impact_json: ${{ steps.impact.outputs.impact_json }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Resolve comparison range
        id: range
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
            if [[ -z "${BASE_SHA}" || "${BASE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
              BASE_SHA=""
            fi
          fi
          echo "base_sha=${BASE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${HEAD_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Install uv
        uses: astral-sh/setup-uv@a02a550bdd3185dba2ebb6aa98d77047ce54ad21 # v6.2.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync repository tooling
        run: uv sync --dev

      - name: Calculate path impact
        id: impact
        env:
          CI_BASE_SHA: ${{ steps.range.outputs.base_sha }}
          CI_HEAD_SHA: ${{ steps.range.outputs.head_sha }}
        run: |
          set -euo pipefail
          uv run python scripts/ci/calculate_path_impact.py --format github
          if [[ -f "${RUNNER_TEMP}/path-impact.txt" ]]; then
            cat "${RUNNER_TEMP}/path-impact.txt"
          fi

  quality-gates:
    name: Quality gates
    needs: path-impact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@a02a550bdd3185dba2ebb6aa98d77047ce54ad21 # v6.2.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync repository tooling
        run: uv sync --dev

      - name: Lockfile check
        run: uv lock --check

      - name: Ruff
        run: uv run ruff check .

      - name: Architecture boundaries
        run: uv run python scripts/quality/verify_boundaries.py

      - name: Agent governance
        run: uv run python scripts/quality/verify_agent_governance.py

      - name: Port allocation verifier
        run: uv run python scripts/quality/verify_port_allocations.py

      - name: Architecture, governance, CI, eventing, capture lab, postgres proof, observation eventing, and NATS security static tests
        run: uv run pytest tests/architecture tests/governance tests/ci tests/eventing tests/polling_lab tests/cdc_lab tests/service_postgres_proof tests/observation_eventing_proof tests/nats_security_proof -m "not integration"

  event-envelope-package:
    name: Event envelope package
    needs: path-impact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@a02a550bdd3185dba2ebb6aa98d77047ce54ad21 # v6.2.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Validate event envelope package
        working-directory: packages/event_envelope
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --dev
          uv run ruff check .
          uv run pytest

  messaging-conformance-package:
    name: Messaging conformance package
    needs: path-impact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@a02a550bdd3185dba2ebb6aa98d77047ce54ad21 # v6.2.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Validate messaging conformance package
        working-directory: packages/messaging_conformance
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --dev
          uv run ruff check .
          uv run pytest -q

  contracts-tests:
    name: Contract tests
    needs: path-impact
    if: >-
      needs.path-impact.outputs.run_contracts_tests == 'true' ||
      needs.path-impact.outputs.full_validation == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@a02a550bdd3185dba2ebb6aa98d77047ce54ad21 # v6.2.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync repository tooling
        run: uv sync --dev

      - name: Run contract tests
        run: uv run pytest tests/contracts -m "not integration"

  cdc-staging-drill-tests:
    name: CDC staging drill static tests
    needs: path-impact
    if: >-
      needs.path-impact.outputs.run_cdc_staging_drill_tests == 'true' ||
      needs.path-impact.outputs.full_validation == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@a02a550bdd3185dba2ebb6aa98d77047ce54ad21 # v6.2.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync repository tooling
        run: uv sync --dev

      - name: Run CDC staging drill static tests
        run: uv run pytest tests/cdc_staging_drill -m "not integration"

  path-filter-tests:
    name: Path filter regression
    needs: path-impact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@a02a550bdd3185dba2ebb6aa98d77047ce54ad21 # v6.2.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync repository tooling
        run: uv sync --dev

      - name: Show calculated impact
        run: |
          echo '${{ needs.path-impact.outputs.impact_json }}' | python -m json.tool

      - name: Path impact tests
        run: uv run pytest tests/ci -v

  service-scoped:
    name: Service scoped (${{ matrix.service }})
    needs: path-impact
    if: needs.path-impact.outputs.run_service_scoped == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.path-impact.outputs.affected_services) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@a02a550bdd3185dba2ebb6aa98d77047ce54ad21 # v6.2.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Run service checks when present
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_DIR="services/${{ matrix.service }}"
          if [[ ! -d "${SERVICE_DIR}" ]]; then
            echo "No service directory for ${{ matrix.service }} — skipping (F0 foundation)."
            exit 0
          fi
          if [[ -f "${SERVICE_DIR}/pyproject.toml" ]]; then
            cd "${SERVICE_DIR}"
            uv lock --check
            uv sync --dev
            uv run ruff check .
          fi
          if [[ -d "${SERVICE_DIR}/tests" ]]; then
            cd "${SERVICE_DIR}"
            uv run pytest tests -v
          fi
          echo "Service checks completed for ${{ matrix.service }}."

  full-validation:
    name: Full validation
    needs: path-impact
    if: needs.path-impact.outputs.full_validation == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@a02a550bdd3185dba2ebb6aa98d77047ce54ad21 # v6.2.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync repository tooling
        run: uv sync --dev

      - name: Discover and validate all services
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for service_dir in services/*/; do
            [[ -d "${service_dir}" ]] || continue
            service_name="$(basename "${service_dir}")"
            if [[ "${service_name}" == "README.md" ]]; then
              continue
            fi
            if [[ -f "${service_dir}/pyproject.toml" ]]; then
              echo "Validating ${service_name}"
              (cd "${service_dir}" && uv lock --check && uv sync --dev && uv run ruff check .)
            fi
            if [[ -d "${service_dir}/tests" ]]; then
              (cd "${service_dir}" && uv run pytest tests -v)
            fi
          done
          echo "Full validation service sweep complete."

      - name: Validate eventing compose configuration
        shell: bash
        run: |
          set -euo pipefail
          if command -v docker >/dev/null 2>&1; then
            docker compose \
              -f infra/compose/eventing-foundation.compose.yaml \
              --profile eventing \
              config
            docker compose \
              -f infra/labs/legacy-polling/compose.yaml \
              --profile polling-lab \
              config
            docker compose \
              -f infra/labs/legacy-cdc/compose.yaml \
              --profile cdc-lab \
              config
            docker compose \
              -f infra/labs/observation-eventing-proof/compose.yaml \
              --profile observation-eventing-proof \
              config
          else
            echo "Docker not available — skipping compose config validation."
          fi

  polling-lab-runtime-integration:
    name: Polling lab runtime integration
    needs: path-impact
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@a02a550bdd3185dba2ebb6aa98d77047ce54ad21 # v6.2.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync repository tooling
        run: uv sync --dev

      - name: Run polling lab integration suite
        run: uv run pytest tests/polling_lab -m integration -v

      - name: Cleanup polling lab resources
        if: always()
        run: sh infra/labs/legacy-polling/scripts/cleanup.sh

  cdc-lab-runtime-integration:
    name: CDC lab runtime integration
    needs: path-impact
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@a02a550bdd3185dba2ebb6aa98d77047ce54ad21 # v6.2.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync repository tooling
        run: uv sync --dev

      - name: Run CDC lab integration suite
        run: uv run pytest tests/cdc_lab -m integration -v

      - name: Cleanup CDC lab resources
        if: always()
        run: sh infra/labs/legacy-cdc/scripts/cleanup.sh

  eventing-runtime-integration:
    name: Eventing runtime integration
    needs: path-impact
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@a02a550bdd3185dba2ebb6aa98d77047ce54ad21 # v6.2.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync repository tooling
        run: uv sync --dev

      - name: Run eventing runtime integration suite
        run: uv run pytest tests/eventing -m integration -v

  service-postgres-proof-runtime-integration:
    name: Service PostgreSQL proof runtime integration
    needs: path-impact
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@a02a550bdd3185dba2ebb6aa98d77047ce54ad21 # v6.2.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync repository tooling
        run: uv sync --dev

      - name: Run service PostgreSQL proof integration suite
        run: uv run pytest tests/service_postgres_proof -m integration -v

      - name: Cleanup service PostgreSQL proof resources
        if: always()
        run: sh infra/labs/service-postgres-proof/scripts/cleanup.sh

  observation-eventing-proof-runtime-integration:
    name: Observation eventing proof runtime integration
    needs: path-impact
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@a02a550bdd3185dba2ebb6aa98d77047ce54ad21 # v6.2.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync repository tooling
        run: uv sync --dev

      - name: Run observation eventing proof integration suite
        run: timeout 90s uv run pytest tests/observation_eventing_proof -m integration -v -o addopts=

      - name: Cleanup observation eventing proof resources
        if: always()
        run: sh infra/labs/observation-eventing-proof/scripts/cleanup.sh

  nats-security-proof-runtime-integration:
    name: NATS security proof runtime integration
    needs: path-impact
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@a02a550bdd3185dba2ebb6aa98d77047ce54ad21 # v6.2.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync repository tooling
        run: uv sync --dev

      - name: Run NATS security proof integration suite
        run: timeout 600s uv run pytest tests/nats_security_proof -m integration -v -o addopts=

      - name: Cleanup NATS security proof resources
        if: always()
        run: sh infra/labs/nats-security-proof/scripts/cleanup.sh

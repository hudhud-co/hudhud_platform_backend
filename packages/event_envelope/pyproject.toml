[project]
name = "event-envelope"
version = "0.1.0"
description = "HUDHUD integration message envelope — technical contract primitives (ADR-0002)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
]

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/event_envelope"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ARG", "PL"]
ignore = [
    "PLR0912",
    "PLR0913",
    "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "PLR0913"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-v"

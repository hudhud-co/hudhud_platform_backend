# HUDHUD runtime port registry — host-port governance baseline (W2-E).
#
# Purpose: machine-readable collision detection and verified bindings.
# This file is NOT a service catalog. Entries describe port roles and evidence.
#
# Statement classes: evidence | reservation | configurable | unresolved
#
# Rules:
# - internal container ports may repeat across isolated networks
# - active host bindings must not collide within the same environment + protocol
# - env-var bindings are represented without pretending they are fixed
# - public exposure must be explicit
# - unknown values stay unresolved — never guessed

version: 1
registry_purpose: host_port_governance
last_verified_against:
  platform_head: fe7ac08fadcbc842db8ccad6606f812eb599cdd8
  legacy_head: 2e375057fdf9b9ce8416408a4436303be5301def
  legacy_dirty_file_preserved: scripts/dev_pickup_driver_simulator.py

binding_kinds:
  internal_container: listens inside a compose network; host may be unpublished
  host_published: fixed or ranged host bind verified or reserved for an environment
  developer_local_default: verified legacy local-dev publish pattern
  staging_reservation: named block reserved; exact host bind unresolved until compose exists
  production_exposure: verified or planned production host exposure
  environment_configurable: bound via named env var; collision check skips fixed host value
  legacy_known: verified binding from hudhud-backend compose (read-only evidence)
  unresolved: role identified; numeric allocation pending capacity proof

protocols: [tcp, udp]

environments:
  legacy_dev_local:
    description: hudhud-backend deploy/docker-compose.local.yml and .dev.yml
    collision_scope: host_active_bindings
  legacy_staging:
    description: hudhud-backend deploy/docker-compose.staging.yml
    collision_scope: host_active_bindings
  legacy_production:
    description: hudhud-backend deploy/docker-compose.prod.yml
    collision_scope: host_active_bindings
  platform_local_dev:
    description: future platform infra/compose local profile (F0 — not scaffolded)
    collision_scope: host_active_bindings
  platform_staging:
    description: future platform staging deploy profile (unresolved)
    collision_scope: host_active_bindings
  platform_production:
    description: future platform production deploy profile (unresolved)
    collision_scope: host_active_bindings


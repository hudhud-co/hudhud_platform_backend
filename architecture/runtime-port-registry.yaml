collision_policy:
  check_active_host_bindings_only: true
  skip_host_types: [unpublished, env_var, unresolved]
  treat_loopback_and_all_interfaces_as_distinct: false
  loopback_collides_with_wildcard: true
  internal_container_reuse_allowed_when:
    - host.type is unpublished
    - network_scope differs OR binding_kind is internal_container

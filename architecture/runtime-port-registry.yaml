      - hudhud-backend/deploy/docker-compose.prod.yml
      - docs/audit/legacy-runtime-inventory.md
    bindings:
      - environment: legacy_dev_local
        active: true
        public_exposure: false
        host:
          type: fixed
          port: 8001
        container:
          port: 8001
        notes: published to all interfaces in local/dev compose
      - environment: legacy_staging
        active: true
        public_exposure: false
        host:
          type: loopback
          port: 8001
        container:
          port: 8001
        notes: 127.0.0.1 bind; nginx upstream per deploy/nginx/staging.example.conf
      - environment: legacy_production

    proposed_platform_owner: audit
    adr_reference: ADR-0002
    adr_status: Accepted
    transitional_deployable_candidate: platform_edge_p1
    extraction_status: pending_wave_1
    policy_prerequisites: []
    data_ownership:
      strategy: dedicated_database
      legacy_tables: [audit_logs]
      notes: Long-term searchable audit retention owner — JetStream is transport only (ADR-0002)
    allowed_dependencies: []
    public_api_ownership: undecided
    published_events: []
    consumed_events:

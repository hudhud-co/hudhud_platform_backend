    legacy_owner: missing
    legacy_module_path: none
    proposed_platform_owner: finance
    adr_reference: ADR-0005
    adr_status: Proposed — Policy Blocked
    transitional_deployable_candidate: policy_blocked
    extraction_status: not_started
    policy_prerequisites: [double_entry_ledger_adr, settlement_policy_adr]
    data_ownership:
      strategy: dedicated_database
      legacy_tables: []
      notes: Accounting authority; consumes CodCollected and ShipmentDelivered; policy-blocked
    allowed_dependencies: [delivery]
    public_api_ownership: finance
    published_events: [finance.fact.posting_completed, finance.fact.merchant_payable_recognized]
    consumed_events: [delivery.fact.cod_collected, shipment.fact.delivered]


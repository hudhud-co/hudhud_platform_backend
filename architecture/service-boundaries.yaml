    legacy_owner: auth
    legacy_module_path: app/modules/auth
    proposed_platform_owner: auth_identity
    adr_reference: ADR-0004
    adr_status: Proposed
    transitional_deployable_candidate: deferred_wave_5
    extraction_status: pending_identity_adr
    policy_prerequisites: [customer_identity_boundary_adr, organization_model_adr]
    data_ownership:
      strategy: undecided
      legacy_tables: [users, user_sessions, otp_requests, roles, permissions, legal_documents]
      notes: RBAC seed in app/core/db/auth_rbac_seed.py — must not become shared package ORM
    allowed_dependencies: []
    public_api_ownership: undecided
    published_events: []
    consumed_events: []

  customer:
    display_name: Customer
    legacy_owner: auth
    legacy_module_path: partial — no standalone module; spread across auth, address_book, send_parcel, tracking, support
    proposed_platform_owner: undecided
    adr_reference: ADR-0004
    adr_status: Proposed
    transitional_deployable_candidate: blocked_pending_adr_0004
    extraction_status: policy_blocked
    policy_prerequisites: [customer_identity_boundary_adr, organization_model_adr]
    data_ownership:
      strategy: undecided
      legacy_tables: partial — profile fields in auth tables
      notes: Customer is a partial capability in legacy, not a module
    allowed_dependencies: []
    public_api_ownership: undecided
    published_events: []
    consumed_events: []

  address_book:
    display_name: Address Book
    legacy_owner: address_book
    legacy_module_path: app/modules/address_book
    proposed_platform_owner: undecided

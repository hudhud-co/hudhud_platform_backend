    legacy_owner: support
    legacy_module_path: app/modules/support, app/modules/claims
    proposed_platform_owner: undecided
    transitional_deployable_candidate: pending_adr
    extraction_status: pending_legacy_audit
    policy_prerequisites: []
    data_ownership:
      strategy: undecided
      legacy_tables: [support_tickets, support_claims, claims]
    allowed_dependencies: []
    public_api_ownership: undecided
    published_events: []
    consumed_events: []

  media_proof:
    display_name: Media and Proof
    legacy_owner: proof
    legacy_module_path: app/modules/proof, evidence in pickup/shipment/delivery_task
    proposed_platform_owner: undecided
    transitional_deployable_candidate: pending_adr
    extraction_status: pending_legacy_audit
    policy_prerequisites: [evidence_ownership_adr]
    data_ownership:
      strategy: undecided
      legacy_tables: [proof_records]
      notes: partial — proof module is stub; evidence spread across operational modules
    allowed_dependencies: []
    public_api_ownership: undecided
    published_events: []
    consumed_events: []

  audit:
    display_name: Audit
    legacy_owner: audit
    legacy_module_path: app/modules/audit
    proposed_platform_owner: undecided
    transitional_deployable_candidate: pending_adr
    extraction_status: pending_legacy_audit
    policy_prerequisites: []
    data_ownership:
      strategy: undecided
      legacy_tables: [audit_logs]
      notes: Cross-cutting append-only — may remain shared or per-service outbox emission
    allowed_dependencies: []
    public_api_ownership: undecided
    published_events: []
    consumed_events: []

  gateway:
    display_name: Gateway
    legacy_owner: n/a
    legacy_module_path: n/a — new platform component
    proposed_platform_owner: gateway
    transitional_deployable_candidate: gateway
    extraction_status: not_started
    policy_prerequisites: [no_gateway_business_orchestration]
    data_ownership:
      strategy: none
      legacy_tables: []
      notes: Gateway must not own domain tables
    allowed_dependencies: []
    public_api_ownership: gateway
    published_events: []
    consumed_events: []

shared_packages:
  allowed_categories:
    - event_envelope
    - tracing
    - idempotency
    - http_client_primitives
    - logging_helpers
  forbidden_categories:
    - domain_models
    - orm_models
    - repositories
    - business_logic
    - alembic_migrations

legacy_reference:
  repository: hudhud-backend
  path: /Users/mohammadakbari/Development/Projects/Python/hudhud-backend
  role: read_only_reference
  runtime_dependency: forbidden

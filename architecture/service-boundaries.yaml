  wallet_cod:
    display_name: Wallet and COD
    legacy_owner: wallet
    legacy_module_path: app/modules/wallet
    proposed_platform_owner: wallet_cod
    adr_reference: ADR-0005
    adr_status: Proposed — Policy Blocked

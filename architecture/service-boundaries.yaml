    extraction_status: not_started
    policy_prerequisites: [double_entry_ledger_adr, settlement_policy_adr]
    data_ownership:
      strategy: dedicated_database
      legacy_tables: []
      notes: policy-blocked in legacy Phase 1 — platform will use double-entry ledger
    allowed_dependencies: [wallet_cod, delivery]
    public_api_ownership: finance
    published_events: []
    consumed_events: [delivery.fact.cod_collected, wallet.fact.cod_credited]

  notification:

version: 1
description: >
  Bounded context boundaries for HUDHUD platform. Distinguishes target domain semantics
  from transitional deployable groupings. Deployable count is NOT fixed here — it is
  determined separately by team size, infrastructure, migration risk, and operational cost.
  Wave 1 ADR integration (2026-08-30): ADR-0001 Accepted (staged deployables, consumer-first);
  ADR-0002 Accepted (eventing); ADR-0003 Accepted (shipment sole writer); ADR-0004 Proposed
  (identity partial); ADR-0005 Proposed — Policy Blocked (finance); ADR-0006 Accepted (cutover).

wave_1_extraction_direction:
  adr: ADR-0001
  status: accepted
  principle: low_risk_consumer_first
  provisional_initial_runtime_count: "3-5 (capacity/team dependent — not architectural fact)"
  hub_linehaul_separate: true

adr_index:
  ADR-0001:
    title: Transitional deployables and extraction order
    status: Accepted
  ADR-0002:
    title: Event envelope, outbox/inbox, and JetStream
    status: Accepted
  ADR-0003:
    title: Shipment lifecycle authority
    status: Accepted
  ADR-0004:
    title: Identity, Gateway, and service trust
    status: Proposed
  ADR-0005:
    title: COD, wallet, ledger, and settlement
    status: Proposed — Policy Blocked
  ADR-0006:
    title: One-writer data cutover
    status: Accepted
  ADR-0007:
    title: Legacy event bridge strategy
    status: Accepted
  ADR-0008:
    title: Service-owned outbox/inbox
    status: Accepted
  ADR-0009:
    title: Initial integration event contracts
    status: Accepted — minimal observation set only

legacy_event_bridge:
  display_name: Legacy Event Bridge
  legacy_owner: n/a
  legacy_module_path: n/a — transitional platform deployable
  proposed_platform_owner: legacy_event_bridge
  adr_reference: ADR-0007
  adr_status: Accepted
  transitional_deployable_candidate: platform_edge_p1
  extraction_status: pending_implementation_gates
  policy_prerequisites: [cdc_wal_level_proof, export_snapshot_drill, bridge_durable_landing]
  data_ownership:
    strategy: dedicated_database
    legacy_tables: []
    notes: >
      Transitional non-authoritative capture relay. Read-only legacy credentials only.
      Owns Bridge checkpoint/outbox landing — not business lifecycle. Retires per ADR-0006 stage 13.
  allowed_dependencies: []
  public_api_ownership: none
  published_events:
    - legacy_bridge.observation.shipment_timeline_entry
    - legacy_bridge.observation.audit_entry
  consumed_events: []
  forbidden:
    - canonical_shipment_lifecycle_authority
    - canonical_audit_fact_authority
    - legacy_write_credentials
    - raw_cdc_row_publication

bounded_contexts:

  auth_identity:

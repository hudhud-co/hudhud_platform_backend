version: 1
description: >
  Bounded context boundaries for HUDHUD platform. Distinguishes target domain semantics
  from transitional deployable groupings. Deployable count is NOT fixed here — it is
  determined separately by team size, infrastructure, migration risk, and operational cost.

bounded_contexts:

  auth_identity:
    display_name: Auth and Identity
    legacy_owner: auth
    legacy_module_path: app/modules/auth
    proposed_platform_owner: undecided
    transitional_deployable_candidate: pending_adr
    extraction_status: pending_legacy_audit
    policy_prerequisites: []
    data_ownership:
      strategy: undecided
      legacy_tables: [users, user_sessions, otp_requests, roles, permissions, legal_documents]
      notes: RBAC seed in app/core/db/auth_rbac_seed.py — must not become shared package ORM
    allowed_dependencies: []
    public_api_ownership: undecided
    published_events: []
    consumed_events: []

  customer:
    display_name: Customer
    legacy_owner: auth
    legacy_module_path: partial — no standalone module; spread across auth, address_book, send_parcel, tracking, support
    proposed_platform_owner: undecided
    transitional_deployable_candidate: pending_adr
    extraction_status: pending_legacy_audit
    policy_prerequisites: [customer_identity_boundary_adr]
    data_ownership:
      strategy: undecided
      legacy_tables: partial — profile fields in auth tables
      notes: Customer is a partial capability in legacy, not a module
    allowed_dependencies: []
    public_api_ownership: undecided
    published_events: []
    consumed_events: []


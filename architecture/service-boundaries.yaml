    consumed_events: []

  shipment:
    display_name: Shipment
    legacy_owner: shipment
    legacy_module_path: app/modules/shipment
    proposed_platform_owner: shipment
    adr_reference: ADR-0003
    adr_status: Accepted
    transitional_deployable_candidate: deferred_wave_3
    extraction_status: pending_cutover
    policy_prerequisites: [shipment_sole_lifecycle_writer]
    data_ownership:
      strategy: dedicated_database
      legacy_tables: [shipments, shipment_events, delivery_evidence_attachments]
      notes: Platform invariant — sole canonical writer of shipment lifecycle state (ADR-0003)
    allowed_dependencies: []
    public_api_ownership: shipment
    published_events: [shipment.fact.delivered, shipment.fact.lifecycle_changed]
    consumed_events: [pickup.fact.accepted, hub.fact.inbound, linehaul.fact.dispatched, linehaul.fact.arrived, delivery.fact.task_completed]

  pickup:
    display_name: Pickup
    legacy_owner: pickup
    legacy_module_path: app/modules/pickup, app/modules/pickup_scheduling
    proposed_platform_owner: pickup
    transitional_deployable_candidate: pending_adr
    extraction_status: pending_legacy_audit
    policy_prerequisites: [shipment_sole_lifecycle_writer]
    data_ownership:
      strategy: dedicated_database
      legacy_tables: [pickup_batches, pickup_tasks, pickup_handover, pickup_evidence, pickup_scheduling]
      notes: Legacy directly mutates shipment status — must migrate to fact publication
    allowed_dependencies: [shipment]
    public_api_ownership: pickup
    published_events: [pickup.fact.accepted, pickup.fact.handover_completed]
    consumed_events: []

  hub:
    display_name: Hub
    legacy_owner: hub
    legacy_module_path: app/modules/hub

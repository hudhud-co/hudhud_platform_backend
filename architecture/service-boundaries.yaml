    policy_prerequisites: []
    data_ownership:
      strategy: undecided
      legacy_tables: [pickup_addresses, receiver_contacts]
    allowed_dependencies: []
    public_api_ownership: undecided
    published_events: []
    consumed_events: []

  merchant_store:
    display_name: Merchant and Store
    legacy_owner: merchant
    legacy_module_path: app/modules/merchant, app/modules/merchant_applications
    proposed_platform_owner: undecided
    transitional_deployable_candidate: pending_adr
    extraction_status: pending_legacy_audit
    policy_prerequisites: []
    data_ownership:
      strategy: undecided
      legacy_tables: [merchants, store_locations, store_categories, store_products, store_team, store_warehouse_assignments]
    allowed_dependencies: []
    public_api_ownership: undecided
    published_events: []
    consumed_events: []

  serviceability:
    display_name: Serviceability
    legacy_owner: send_parcel
    legacy_module_path: app/modules/send_parcel/domain/serviceability.py
    proposed_platform_owner: undecided
    transitional_deployable_candidate: pending_adr
    extraction_status: pending_legacy_audit
    policy_prerequisites: [serviceability_engine_adr]
    data_ownership:
      strategy: undecided
      legacy_tables: none — env-based allowlist only
      notes: partial — city:area allowlist, no geo engine
    allowed_dependencies: []
    public_api_ownership: undecided
    published_events: []
    consumed_events: []

  pricing_quote:
    display_name: Pricing and Quote
    legacy_owner: send_parcel
    legacy_module_path: app/modules/send_parcel/domain/pricing.py
    proposed_platform_owner: undecided
    transitional_deployable_candidate: pending_adr
    extraction_status: pending_legacy_audit
    policy_prerequisites: [pricing_model_adr]
    data_ownership:
      strategy: undecided
      legacy_tables: none — rule version send_parcel_v1 in code
      notes: partial — flat IQD tariff only
    allowed_dependencies: []
    public_api_ownership: undecided
    published_events: []
    consumed_events: []

  order:
    display_name: Order
    legacy_owner: order
    legacy_module_path: app/modules/order
    proposed_platform_owner: undecided
    transitional_deployable_candidate: pending_adr
    extraction_status: pending_legacy_audit
    policy_prerequisites: []
    data_ownership:
      strategy: undecided
      legacy_tables: [orders]
    allowed_dependencies: []
    public_api_ownership: undecided
    published_events: []
    consumed_events: []

  send_parcel:
    display_name: Send Parcel
    legacy_owner: send_parcel
    legacy_module_path: app/modules/send_parcel
    proposed_platform_owner: undecided
    transitional_deployable_candidate: pending_adr
    extraction_status: pending_legacy_audit
    policy_prerequisites: []
    data_ownership:
      strategy: undecided
      legacy_tables: none — orchestrates order + shipment creation
    allowed_dependencies: []
    public_api_ownership: undecided
    published_events: []
    consumed_events: []

  shipment:
    display_name: Shipment
    legacy_owner: shipment
    legacy_module_path: app/modules/shipment
    proposed_platform_owner: shipment
    transitional_deployable_candidate: pending_adr
    extraction_status: pending_legacy_audit
    policy_prerequisites: [shipment_sole_lifecycle_writer]
    data_ownership:
      strategy: dedicated_database
      legacy_tables: [shipments, shipment_events, delivery_evidence_attachments]
      notes: Platform invariant — sole canonical writer of shipment lifecycle state
    allowed_dependencies: []
    public_api_ownership: shipment
    published_events: [shipment.lifecycle.changed]
    consumed_events: [pickup.fact.accepted, hub.fact.inbound, linehaul.fact.dispatched, linehaul.fact.arrived, delivery.command.complete]

  pickup:
    display_name: Pickup
    legacy_owner: pickup
    legacy_module_path: app/modules/pickup, app/modules/pickup_scheduling
    proposed_platform_owner: pickup
    transitional_deployable_candidate: pending_adr
    extraction_status: pending_legacy_audit
    policy_prerequisites: [shipment_sole_lifecycle_writer]
    data_ownership:
      strategy: dedicated_database
      legacy_tables: [pickup_batches, pickup_tasks, pickup_handover, pickup_evidence, pickup_scheduling]
      notes: Legacy directly mutates shipment status — must migrate to fact publication
    allowed_dependencies: [shipment]
    public_api_ownership: pickup
    published_events: [pickup.fact.accepted, pickup.fact.handover_completed]
    consumed_events: []

  hub:
    display_name: Hub
    legacy_owner: hub
    legacy_module_path: app/modules/hub
    proposed_platform_owner: hub
    transitional_deployable_candidate: pending_adr
    extraction_status: pending_legacy_audit
    policy_prerequisites: [shipment_sole_lifecycle_writer]
    data_ownership:
      strategy: dedicated_database
      legacy_tables: [hubs, hub_operations]
      notes: Legacy directly mutates shipment status — must migrate to fact publication. Hub and Linehaul remain separate bounded contexts.
    allowed_dependencies: [shipment]
    public_api_ownership: hub
    published_events: [hub.fact.inbound, hub.fact.condition_checked]
    consumed_events: []

  linehaul:
    display_name: Linehaul
    legacy_owner: linehaul
    legacy_module_path: app/modules/linehaul
    proposed_platform_owner: linehaul
    transitional_deployable_candidate: pending_adr
    extraction_status: pending_legacy_audit
    policy_prerequisites: [shipment_sole_lifecycle_writer]
    data_ownership:
      strategy: dedicated_database
      legacy_tables: [linehaul_trips, linehaul_trip_shipments]
      notes: Legacy directly mutates shipment status — must migrate to fact publication. Not merged with Hub.
    allowed_dependencies: [shipment]
    public_api_ownership: linehaul
    published_events: [linehaul.fact.dispatched, linehaul.fact.arrived]
    consumed_events: []

  delivery:
    display_name: Delivery
    legacy_owner: delivery_task
    legacy_module_path: app/modules/delivery, app/modules/delivery_task
    proposed_platform_owner: delivery
    transitional_deployable_candidate: pending_adr
    extraction_status: pending_legacy_audit
    policy_prerequisites: [shipment_sole_lifecycle_writer, physical_delivery_irreversible]
    data_ownership:
      strategy: dedicated_database
      legacy_tables: [delivery_tasks, delivery_cod_collections, delivery_evidence]
      notes: Physical delivery is irreversible operational fact
    allowed_dependencies: [shipment]
    public_api_ownership: delivery
    published_events: [delivery.fact.completed, delivery.fact.failed, delivery.fact.cod_collected]
    consumed_events: []

  tracking:
    display_name: Tracking
    legacy_owner: tracking
    legacy_module_path: app/modules/tracking
    proposed_platform_owner: undecided
    transitional_deployable_candidate: pending_adr
    extraction_status: pending_legacy_audit
    policy_prerequisites: []
    data_ownership:
      strategy: read_projection
      legacy_tables: none — reads shipments/events
    allowed_dependencies: [shipment]
    public_api_ownership: undecided
    published_events: []
    consumed_events: [shipment.lifecycle.changed]

  control_tower:
    display_name: Control Tower
    legacy_owner: control_tower
    legacy_module_path: app/modules/control_tower
    proposed_platform_owner: undecided
    transitional_deployable_candidate: pending_adr
    extraction_status: pending_legacy_audit
    policy_prerequisites: []
    data_ownership:
      strategy: read_projection
      legacy_tables: none — aggregation reads
      notes: partial in legacy — ops visibility only
    allowed_dependencies: [shipment]
    public_api_ownership: undecided
    published_events: []
    consumed_events: []

  wallet_cod:
    display_name: Wallet and COD
    legacy_owner: wallet
    legacy_module_path: app/modules/wallet
    proposed_platform_owner: undecided
    transitional_deployable_candidate: pending_adr
    extraction_status: pending_legacy_audit
    policy_prerequisites: [cod_wallet_separation]
    data_ownership:
      strategy: undecided
      legacy_tables: [wallet_accounts, wallet_ledger_entries, payout_requests]
      notes: COD collection in delivery_task is separate fact from wallet credit
    allowed_dependencies: []
    public_api_ownership: undecided
    published_events: [wallet.fact.cod_credited]
    consumed_events: [delivery.fact.cod_collected]

  finance_settlement:
    display_name: Finance and Settlement
    legacy_owner: missing

  gateway:
    display_name: Gateway
    legacy_owner: n/a
    legacy_module_path: n/a — new platform component
    proposed_platform_owner: gateway
    adr_reference: ADR-0004
    adr_status: Proposed
    transitional_deployable_candidate: platform_edge_p1
    extraction_status: pending_wave_0
    policy_prerequisites: [no_gateway_business_orchestration]
    data_ownership:
      strategy: none
      legacy_tables: []
      notes: Gateway must not own domain tables
    allowed_dependencies: []
    public_api_ownership: gateway
    published_events: []
    consumed_events: []

shared_packages:
  allowed_categories:
    - event_envelope
    - messaging_conformance
    - tracing
    - idempotency
    - http_client_primitives
    - logging_helpers
  forbidden_categories:
    - domain_models
    - orm_models
    - repositories
    - business_logic
    - alembic_migrations
  adr_reference: ADR-0002

legacy_reference:

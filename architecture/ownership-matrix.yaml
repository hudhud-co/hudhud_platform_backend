version: 1
description: >
  Bounded context write/read responsibilities. Transitional technical deployables
  (Legacy Event Bridge) are recorded outside `ownership` so they are not mistaken
  for bounded contexts or canonical aggregate owners.
  Wave 1 ADR integration: shipment sole writer (ADR-0003); eventing (ADR-0002); one-writer
  cutover (ADR-0006); finance policy-blocked (ADR-0005); identity partial (ADR-0004).

adr_references:
  shipment_sole_writer: ADR-0003
  eventing: ADR-0002
  data_cutover: ADR-0006
  identity_trust: ADR-0004
  finance_settlement: ADR-0005
  deployables: ADR-0001
  legacy_bridge: ADR-0007
  outbox_inbox: ADR-0008
  initial_contracts: ADR-0009

legacy_event_bridge:
  classification: transitional_technical_deployable
  bounded_context: false
  canonical_aggregate_owner: false
  role: cdc_adapter_publisher
  authority: non_authoritative
  canonical_writer: none
  adr_reference: ADR-0007
  adr_status: Accepted
  readers: []
  api_owner: none
  event_publisher: legacy_bridge
  domain_database_owner: none
  technical_state_owner: legacy_event_bridge
  technical_state_scope: landing_checkpoint_outbox
  retires_per_context: true
  notes: >
    Transitional CDC adapter/publisher. Non-authoritative.
    Not a bounded context or canonical aggregate owner.
    Owns Bridge-local technical landing/outbox state only.
    Owns no Shipment, Audit, Delivery, Finance, or other domain lifecycle.
    Retired per context after cutover (ADR-0006 stage 13).
  publishes_observations:
    - legacy_bridge.observation.shipment_timeline_entry
    - legacy_bridge.observation.audit_entry
  forbidden:
    - business_lifecycle_ownership
    - domain_lifecycle_ownership
    - legacy_database_write
    - canonical_domain_fact_emission
    - bounded_context_status
    - canonical_aggregate_ownership

ownership:
  auth_identity:
    canonical_writer: auth_identity
    adr_reference: ADR-0004
    adr_status: Proposed
    readers: [customer, merchant_store, pickup, delivery, gateway]
    api_owner: auth_identity
    event_publisher: auth_identity
    database_owner: auth_identity

  customer:
    canonical_writer: undecided
    adr_reference: ADR-0004
    adr_status: Proposed
    readers: [send_parcel, tracking, support_claims]
    api_owner: undecided
    event_publisher: undecided
    database_owner: undecided

  address_book:
    canonical_writer: address_book
    readers: [order, send_parcel]
    api_owner: address_book
    event_publisher: address_book
    database_owner: address_book

  merchant_store:
    canonical_writer: merchant_store
    readers: [order, shipment, wallet_cod, send_parcel]
    api_owner: merchant_store
    event_publisher: merchant_store
    database_owner: merchant_store

  serviceability:
    canonical_writer: serviceability
    readers: [send_parcel, order]
    api_owner: serviceability
    event_publisher: serviceability
    database_owner: undecided

  pricing_quote:
    canonical_writer: pricing_quote
    readers: [send_parcel, order]
    api_owner: pricing_quote
    event_publisher: pricing_quote
    database_owner: undecided

  order:
    canonical_writer: order
    readers: [send_parcel, shipment]
    api_owner: order
    event_publisher: order
    database_owner: order

  send_parcel:
    canonical_writer: send_parcel
    readers: []
    api_owner: send_parcel
    event_publisher: send_parcel
    database_owner: undecided

  shipment:
    canonical_writer: shipment
    adr_reference: ADR-0003
    adr_status: Accepted
    readers: [tracking, control_tower, pickup, hub, linehaul, delivery, notification, finance_settlement]
    api_owner: shipment
    event_publisher: shipment
    database_owner: shipment
    invariants:
      - sole_lifecycle_state_writer
      - no_direct_status_mutation_by_other_contexts

  pickup:
    canonical_writer: pickup
    readers: [shipment, hub]
    api_owner: pickup
    event_publisher: pickup
    database_owner: pickup
    writes_to_other_contexts:
      legacy_violation: shipment.status
      platform_replacement: publish pickup.fact.* events

  hub:
    canonical_writer: hub
    readers: [shipment, linehaul]
    api_owner: hub
    event_publisher: hub
    database_owner: hub
    writes_to_other_contexts:
      legacy_violation: shipment.status
      platform_replacement: publish hub.fact.* events

  linehaul:
    canonical_writer: linehaul
    readers: [shipment, hub]
    api_owner: linehaul
    event_publisher: linehaul
    database_owner: linehaul
    writes_to_other_contexts:
      legacy_violation: shipment.status
      platform_replacement: publish linehaul.fact.* events

  delivery:
    canonical_writer: delivery
    adr_reference: ADR-0003
    adr_status: Accepted
    readers: [shipment, finance_settlement]
    api_owner: delivery
    event_publisher: delivery
    database_owner: delivery
    writes_to_other_contexts:
      legacy_violation: shipment.status
      platform_replacement: publish delivery.fact.task_completed and delivery.fact.cod_collected
    separate_facts:
      - cod_collection_record
      - physical_delivery_completion
    forbidden_writes:
      - wallet_cod.direct_credit
      - shipment.lifecycle_direct_mutation

  tracking:
    canonical_writer: none
    readers: [tracking]
    api_owner: tracking
    event_publisher: none
    database_owner: none
    notes: read projection only

  control_tower:
    canonical_writer: none
    readers: [control_tower]
    api_owner: control_tower
    event_publisher: none
    database_owner: none
    notes: read aggregation only

  wallet_cod:
    canonical_writer: wallet_cod
    adr_reference: ADR-0005
    adr_status: Proposed — Policy Blocked
    readers: [finance_settlement, merchant_store]
    api_owner: wallet_cod
    event_publisher: wallet_cod
    database_owner: wallet_cod
    notes: Projection of Finance-authorized merchant payable — not written by Delivery
    separate_facts:
      - finance_authorized_projection_only

  finance_settlement:
    canonical_writer: finance_settlement
    adr_reference: ADR-0005
    adr_status: Proposed — Policy Blocked
    readers: [merchant_store, wallet_cod]
    api_owner: finance_settlement
    event_publisher: finance_settlement
    database_owner: finance_settlement
    status: policy_blocked
    consumed_events:
      - delivery.fact.cod_collected
      - shipment.fact.delivered
    publishes_to:
      - wallet_cod.projection

  notification:
    canonical_writer: notification
    readers: []
    api_owner: notification
    event_publisher: notification
    database_owner: notification

  support_claims:
    canonical_writer: support_claims
    readers: [customer]
    api_owner: support_claims
    event_publisher: support_claims
    database_owner: support_claims

  media_proof:
    canonical_writer: undecided
    readers: [control_tower, pickup, delivery, support_claims]
    api_owner: undecided
    event_publisher: undecided
    database_owner: undecided

  audit:
    canonical_writer: audit
    readers: [control_tower]
    api_owner: audit
    event_publisher: audit
    database_owner: audit
    consumed_events:
      - legacy_bridge.observation.audit_entry
    notes: Native audit.fact.entry_recorded deferred until Audit cutover

  gateway:
    canonical_writer: none
    readers: []
    api_owner: gateway
    event_publisher: none
    database_owner: none
    forbidden:
      - domain_table_ownership
      - business_orchestration

cross_cutting_rules:
  - name: shipment_lifecycle
    rule: Only shipment context writes canonical shipment lifecycle state
    adr: ADR-0003
  - name: physical_delivery
    rule: Delivery completion is irreversible; finance failures do not roll back
    adr: ADR-0003
  - name: cod_accounting
    rule: COD collection (Delivery) and merchant payable (Finance) are separate; Wallet is Finance projection
    adr: ADR-0005
  - name: eventing
    rule: At-least-once JetStream with per-service durable consumers and idempotent inbox
    adr: ADR-0002
  - name: data_cutover
    rule: One-writer cutover; no bidirectional dual-write; credential revocation mandatory
    adr: ADR-0006
  - name: cross_service_fk
    rule: Forbidden — use IDs and events instead
  - name: legacy_dependency
    rule: hudhud-backend is never a runtime dependency
  - name: legacy_bridge_cdc
    rule: Legacy Event Bridge is a transitional technical deployable (CDC adapter/publisher), not a bounded context or domain owner; publishes observations only; retires at cutover
    adr: ADR-0007
  - name: service_owned_outbox_inbox
    rule: Each service owns outbox/inbox schema; no shared ORM; inbox idempotency authoritative over NATS dedupe
    adr: ADR-0008
  - name: extraction_order
    rule: Low-risk consumer-first extraction; Hub and Linehaul remain separate
    adr: ADR-0001

      incident_resolution: operations_only_OPS_07
      high_value_threshold: blocked_CLM_08_no_default_fails_closed
      request_scoped_unit_of_work: yes_built_this_way_from_the_start

  media_proof:
    canonical_writer: none
    adr_reference: ADR-0011
    adr_status: Accepted
    readers: [control_tower, pickup, delivery, support_claims]
    api_owner: none
    event_publisher: none
    database_owner: none
    notes: >
      Not a service. Evidence is referenced by an opaque EvidenceMediaRef (bucket + key)
      owned by whichever context records it. No context stores inline bytes.

  audit:
    canonical_writer: audit
    readers: [control_tower]
    api_owner: audit
    event_publisher: audit
    database_owner: audit
    consumed_events:
      - legacy_bridge.observation.audit_entry
    runtime_evidence:
      postgres_persistence: proven_local_disposable_lab
      jetstream_pull_consumer: proven_local_disposable_lab_no_auth
      production_ready: false
    notes: Native audit.fact.entry_recorded deferred until Audit cutover

  gateway:
    canonical_writer: none
    readers: []
    api_owner: gateway
    event_publisher: none
    database_owner: none
    forbidden:
      - domain_table_ownership
      - business_orchestration

cross_cutting_rules:
  - name: shipment_lifecycle
    rule: Only shipment context writes canonical shipment lifecycle state
    adr: ADR-0003
  - name: physical_delivery
    rule: Delivery completion is irreversible; finance failures do not roll back
    adr: ADR-0003
  - name: cod_accounting
    rule: COD collection (Delivery) and merchant payable (Finance) are separate; Wallet is Finance projection
    adr: ADR-0005
  - name: eventing
    rule: At-least-once JetStream with per-service durable consumers and idempotent inbox
    adr: ADR-0002
  - name: data_cutover
    rule: One-writer cutover; no bidirectional dual-write; credential revocation mandatory
    adr: ADR-0006
  - name: custody_release
    rule: >
      A parcel leaves pickup-driver custody only when a hub-scoped actor records a
      receipt; a listed-but-missing parcel stays with its driver and publishes nothing.
      Shipment applies the canonical transfer from pickup.fact.handover_completed.
    adr: ADR-0003
  - name: merchant_stop_outcome
    rule: >
      A parcel refused at the door or never presented by the merchant stays with the
      merchant. Neither outcome starts custody, so neither publishes a fact and neither
      changes Shipment. Packaging judged too weak to survive transport can only be
      refused — it can never be accepted with a warning or a note.

  - name: sender_handover_ceremony
    rule: >
      Custody starts only after the sender verifies the assigned courier and confirms
      the parcel manifest. The assigned courier can never satisfy the sender half, and
      one ceremony authorizes exactly one acceptance.
  - name: offline_work_authority
    rule: >
      A driver may only replay offline commands for work downloaded under a signed,
      device-bound, time-boxed authorization. Every submission is preserved; nothing is
      silently dropped; custody acceptance is never authorized offline.
    adr: ADR-0008
  - name: cross_service_fk
    rule: Forbidden — use IDs and events instead
  - name: legacy_dependency
    rule: hudhud-backend is never a runtime dependency
  - name: legacy_bridge_cdc
    rule: Legacy Event Bridge is a transitional technical deployable (CDC adapter/publisher), not a bounded context or domain owner; publishes observations only; retires at cutover
    adr: ADR-0007
  - name: service_owned_outbox_inbox
    rule: Each service owns outbox/inbox schema; no shared ORM; inbox idempotency authoritative over NATS dedupe
    adr: ADR-0008
  - name: extraction_order
    rule: Low-risk consumer-first extraction; Hub and Linehaul remain separate
    adr: ADR-0001

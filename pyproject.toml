[project]
name = "hudhud-platform"
version = "0.0.0"
description = "HUDHUD platform backend monorepo — repository tooling and architecture gates (Foundation F0)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "nats-py>=2.9",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ARG", "PL"]
ignore = [
    "PLR0912",
    "PLR0915",
    "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "PLR0913"]
"scripts/**" = ["PLR0913"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
markers = [
    "integration: requires Docker runtime for eventing infrastructure proof",
]
